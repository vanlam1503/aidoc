services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - academy-data:/app/.data

volumes:
  academy-data:
